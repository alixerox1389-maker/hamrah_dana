name: Build Hamrah Dana APK

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Extract project
    run: |
      set -e
      mkdir -p source
      unzip -o hamrah_dana_clean_project.zip -d source
      cp -a source/. .

  - name: Generate Android project
    run: |
      flutter create \
        --platforms=android \
        --org com.hamrahdana \
        --project-name hamrah_dana \
        .

  - name: Get dependencies
    run: flutter pub get

  - name: Build APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: hamrah-dana-apk
      path: build/app/outputs/flutter-apk/app-release.apk
