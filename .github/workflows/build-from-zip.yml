name: Build Hamrah Dana APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o hamrah_dana_mobile_ready.zip -d .
          sed -i 's/8\.3\.2/8.5.2/g' android/settings.gradle
          sed -i 's/gradle-8\.4/gradle-8.7/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Check Android versions
        run: |
          echo "SETTINGS GRADLE:"
          cat android/settings.gradle
          echo "GRADLE WRAPPER:"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamrah-dana-apk
          path: build/app/outputs/flutter-apk/app-release.apk
